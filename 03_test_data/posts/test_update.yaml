- title: "全量更新posts信息 (PUT)"
  post_id: 1
  method: "PUT"
  payload:
    userId: 1
    title: "sun is sun"
    body: "moon is moon"
  expected_status: 200
  expected_title: "sun is sun"
  expected_body: "moon is moon"

- title: "局部更新posts (PATCH)"
  post_id: 2
  method: "PATCH"
  payload:
    title: "sun is not sun"
  expected_status: 200
  expected_title: "sun is not sun"